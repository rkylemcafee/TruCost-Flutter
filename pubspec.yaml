name: trucost_flutter
description: "TruCost Co-Pilot — true cost-per-mile calculator and AI assistant for owner-operators."
publish_to: 'none'

version: 2.0.0+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  image_picker: ^1.2.2
  path_provider: ^2.1.6
  geolocator: ^14.0.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  share_plus: ^13.1.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  audio_session: ^0.2.3
  image_cropper: ^12.2.1
  gal: ^2.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  google_fonts: ^8.1.0
  video_player: ^2.11.1
  shared_preferences: ^2.5.5
  google_maps_flutter: ^2.18.1
  file_picker: ^13.3.0
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/trucost_logo.jpg
    - assets/copilot/f1.png
    - assets/copilot/f2.png
    - assets/copilot/f3.png
    - assets/copilot/f4.png
    - assets/copilot/m1.png
    - assets/copilot/m2.png
    - assets/copilot/m3.png
    - assets/copilot/m4.png
    - assets/copilot/gigi.png
    - assets/trucost-copilot-splash.mp4
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
